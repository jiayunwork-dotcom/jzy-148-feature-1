services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scorecard
      POSTGRES_PASSWORD: scorecard
      POSTGRES_DB: scorecard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scorecard -d scorecard"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://scorecard:scorecard@db:5432/scorecard
    ports:
      - "8000:8000"

volumes:
  pgdata:
